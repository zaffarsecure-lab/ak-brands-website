  try {
    const batch = writeBatch(db);
    xs.forEach((x) => batch.set(doc(db, "orders", x.orderNo), kind === "inv" ? { invLock: false, invUnlocks: (xs[0].invUnlocks || 0) + 1, invUnlockedAt: serverTimestamp(), updatedAt: serverTimestamp() } : { urdLock: false, urdUnlocks: (xs[0].urdUnlocks || 0) + 1, urdUnlockedAt: serverTimestamp(), updatedAt: serverTimestamp() }, { merge: true }));
    await batch.commit();
    V.busy = false; await loadOrder(V.group[0], (kind === "inv" ? "Invoice " : "URD bill ") + num_ + " unlocked. This unlock is recorded."); loadList();
  } catch (err) { V.busy = false; console.error(err); render(); say("ule", "That did not save. Check your connection and try again.", true); }
}
async function saveInvoice(first, lock){
  if (V.busy) return; V.busy = true;
  try {
    const o = V.cur, os = V.os, grp = V.group; if (issues(o).length) throw new UserError("Some details are missing.");
    const added = os.filter((x) => !V.saved.has(x.orderNo));
    for (const x of (first ? os : added)) { const f = await fetchOrder(x.orderNo); if (!f || orderLocked(f)) throw new UserError("Order " + x.orderNo + " already has an invoice or URD bill. Reload and check."); }
    let msg, rev = Number(o.invRev) || 0;
    if (first) { o.invoiceDate = o.invoiceDate || todayISO(); o.invoiceNo = await nextDocNo("inv", o.invoiceDate); msg = "Invoice " + o.invoiceNo + " generated" + (grp.length > 1 ? " for " + grp.length + " orders. All of them are marked." : ". The order is marked."); }
    else { rev += 1; msg = (lock ? "Invoice " + o.invoiceNo + " saved and locked." : "Changes saved on " + o.invoiceNo + (added.length ? ". " + added.map((x) => x.orderNo).join(", ") + " added to it." : ".")); }
    const batch = writeBatch(db), urdNo = os[0].urdNo, urdDate = os[0].urdDate;
    os.forEach((x, i) => {
      const d = { invoiceNo: o.invoiceNo, invoiceDate: o.invoiceDate, updatedAt: serverTimestamp() };
      if (!x.invoiceNo) { d.invGenerated = true; d.invGeneratedAt = serverTimestamp(); }
      if (grp.length > 1) { d.invGroup = grp; d.invMergedInto = i ? grp[0] : ""; }
      if (urdNo && !x.urdNo && os[0].urdMode !== "each") { d.urdNo = urdNo; d.urdDate = urdDate; d.urdMode = os[0].urdMode || "one"; }
      if (lock) { d.invLock = true; d.invLockedAt = serverTimestamp(); }
      if (i === 0) { d.invDoc = pick(o); if (!first) { d.invRev = rev; d.invCorrectedAt = serverTimestamp(); } }
      batch.set(doc(db, "orders", x.orderNo), d, { merge: true });
    });
    await batch.commit();
    V.busy = false; await loadOrder(grp[0], msg + (added.length && urdNo ? " Now save the URD bill below again so it includes the new order." : "")); loadList(); scrollTo(0, 0);
  } catch (err) {
    V.busy = false; if (!(err instanceof UserError)) console.error(err);
    render(); say("gm", err instanceof UserError ? err.message : "That did not save. Technical reason: " + String((err && (err.code || err.message)) || err).slice(0, 160), true);
  }
}
async function makeUrd(){
  if (V.busy) return; V.busy = true; V.urdStage = "start";
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) throw new UserError("The PDF tool did not load. Check your internet connection, reload this page and try again.");
    const os = V.os, grp = V.group, u = V.urd, added = os.filter((x) => !V.saved.has(x.orderNo));
    if (!(u.supplier.name || "").trim()) throw new UserError("Add the supplier's name first.");
    if (!u.items.length || u.items.some((it) => !(it.name || "").trim() || !(num(it.supRate) > 0) || !(num(it.qty) > 0))) throw new UserError("Add the product name, quantity and supplier rate for every item first.");
    if (os[0].invoiceNo && added.length) throw new UserError("Save the invoice correction first. It adds the new order to the invoice. Then make the URD bill.");
    const UL = urdLocked(), each = os[0].urdNo ? os[0].urdMode === "each" : (V.urdMode === "each" && os.length > 1);
    let date = u.date || os[0].urdDate || todayISO(), nums = {};
    if (!UL) {
      V.urdStage = "numbering";
      for (const x of added) { const f = await fetchOrder(x.orderNo); if (!f || orderLocked(f)) throw new UserError("Order " + x.orderNo + " already has an invoice or URD bill. Reload and check."); }
      let one = os[0].urdNo;
      if (each) { for (const x of os) nums[x.orderNo] = x.urdNo || await nextDocNo("urd", date); }
      else { if (!one) one = await nextDocNo("urd", date); os.forEach((x) => { nums[x.orderNo] = one; }); }
      V.urdStage = "saving";
      const batch = writeBatch(db);
      os.forEach((x, i) => {
        const d = { urdNo: nums[x.orderNo], urdDate: date, urdMode: each ? "each" : "one", updatedAt: serverTimestamp() };
        if (grp.length > 1) { d.invGroup = grp; d.invMergedInto = i ? grp[0] : ""; }
        if (each) d.urdDoc = { date, supplier: u.supplier, items: u.items.filter((it) => it.src === x.orderNo) };
        else if (i === 0) d.urdDoc = { date, supplier: u.supplier, items: u.items };
        batch.set(doc(db, "orders", x.orderNo), d, { merge: true });
      });
      await batch.commit();
      os.forEach((x) => { x.urdNo = nums[x.orderNo]; x.urdDate = date; x.urdMode = each ? "each" : "one"; if (grp.length > 1) x.invGroup = grp; V.saved.add(x.orderNo); });
      V.base.urdNo = os[0].urdNo; V.base.urdDate = date; u.date = date; V.urdDirty = false;
    } else { os.forEach((x) => { nums[x.orderNo] = x.urdNo; }); date = os[0].urdDate || date; }
    V.urdStage = "making the PDF (the URD number is already saved)"; const names = [];
    const mk = async (no, list, ordNo) => {
      const base = clone(V.base); base.supplier = Object.assign({}, base.supplier, u.supplier); base.items = list; base.urdNo = no; base.urdDate = date; base.orderNo = ordNo;
      const pdf = makeSupplierCopyPdf(window.jspdf.jsPDF, buildUrd(base, biz)), name = "Supplier-Copy-" + safeName(no) + ".pdf"; pdf.save(name); names.push(name);
    };
    if (each) { for (let i = 0; i < os.length; i++) { await mk(nums[os[i].orderNo], u.items.filter((it) => it.src === os[i].orderNo), os[i].orderNo); if (i < os.length - 1) await new Promise((r) => setTimeout(r, 900)); } }
    else await mk(nums[os[0].orderNo], u.items, grp.join(", "));
    V.urdMsg = names.join(", ") + (names.length > 1 ? " are" : " is") + " downloading. Check your Downloads folder." + (names.length > 1 ? " If only one arrived, allow multiple downloads when your phone asks." : ""); V.busy = false; render(); loadList();
  } catch (err) {
    V.busy = false; if (!(err instanceof UserError)) console.error(err);
    V.urdMsg = err instanceof UserError ? err.message : "That did not work. Technical reason: " + String((err && (err.code || err.message)) || err).slice(0, 160) + (V.urdStage ? " (at: " + V.urdStage + ")" : ""); render(); say("um", V.urdMsg, true);
  }
}
async function download(kind){
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) throw new UserError("The PDF tool did not load. Check your internet connection, reload this page and try again.");
    const JsPDF = window.jspdf.jsPDF, o = clone(V.cur); o.orderNo = V.group.join(", "); let pdf, name;
    const miss = issues(o, kind); if (miss.length) throw new UserError("Add " + miss.join(", ") + " first.");
    const logo = await loadLogo();
    if (kind === "transporter") { pdf = makeTransporterCopyPdf(JsPDF, buildInvoice(o, biz, "transporter"), logo); name = "Transporter-Copy-" + safeName(o.invoiceNo) + ".pdf"; }
    else { pdf = makeCustomerCopyPdf(JsPDF, buildInvoice(o, biz, "customer"), logo); name = "Customer-Copy-" + safeName(o.invoiceNo) + ".pdf"; }
    pdf.save(name); V.copyMsg = name + " is downloading. Check your Downloads folder."; render(); say("cm", V.copyMsg, false);
  } catch (err) {
    if (!(err instanceof UserError)) console.error(err);
    V.copyMsg = err instanceof UserError ? err.message : "That did not work. Check your connection and try again."; render(); say("cm", V.copyMsg, true);
  }
}
document.addEventListener("toggle", (e) => { if (e.target && e.target.classList && e.target.classList.contains("urdd")) V.urdOpen = e.target.open; }, true);
window.__invoicesReady = true;
